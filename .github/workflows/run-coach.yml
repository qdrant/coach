name: Coach

on:
  push:
    branches: [ "master", "automation" ]
  schedule:
    # every day at 12 CET
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      qdrant_version:
        description: "Docker Hub tag (dev, v1.16.0) or full image ref (ghcr.io/qdrant/qdrant:dev-<full-commit-sha>)"
        default: dev
      coaching_time:
        description: "Duration in seconds, default is 3600s (60 min) "
        default: 3600
      qdrant_extra_env:
        description: "Extra space-separated KEY=VALUE env vars for qdrant, override the defaults (e.g. QDRANT__FEATURE_FLAGS__ALL=false)"
        default: ""
      coach_extra_args:
        description: "Extra args for coach (e.g. --drills-to-run high_concurrency)"
        default: ""
      notify:
        description: "Send a Slack notification on failure"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Process inputs
        id: default_inputs
        env:
          INPUT_QDRANT_VERSION: ${{ inputs.qdrant_version }}
          INPUT_COACHING_TIME: ${{ inputs.coaching_time }}
        run: |
          qdrant_version="$INPUT_QDRANT_VERSION"
          if [ -z "$qdrant_version" ]; then
            qdrant_version=dev
          fi

          coaching_time="$INPUT_COACHING_TIME"
          if [ -z "$coaching_time" ]; then
            coaching_time=3600
          fi

          echo "qdrant_version=$qdrant_version" >> $GITHUB_OUTPUT
          echo "coaching_time=$coaching_time" >> $GITHUB_OUTPUT
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      # checkout coach
      - name: Checkout Coach
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Coach (release)
        run: cargo build --release
      - name: Coach things
        shell: bash
        env:
          COACHING_TIME: ${{ steps.default_inputs.outputs.coaching_time }}
          QDRANT_VERSION: ${{ steps.default_inputs.outputs.qdrant_version }}
          QDRANT_EXTRA_ENV: ${{ inputs.qdrant_extra_env }}
          COACH_EXTRA_ARGS: ${{ inputs.coach_extra_args }}
          OUTPUT_DIR: coach-output
        run: |
          ./coach-things.sh "$COACHING_TIME" "$QDRANT_VERSION"
      - name: Upload qdrant logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qdrant-logs
          path: coach-output/
          if-no-files-found: ignore
      - name: Send Notification
        if: (failure() || cancelled()) && inputs.notify != false
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.COACH_CHANNEL_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Coach run status: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Something is wrong.\nView the results <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|here>"
                  }
                }
              ]
            }
